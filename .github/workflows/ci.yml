name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Build and test
        run: bash scripts/check.sh
      - name: Build the app bundle (ad-hoc)
        run: bash scripts/build.sh
